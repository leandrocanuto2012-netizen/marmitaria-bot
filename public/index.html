<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marmitaria — Acesso</title>
  <link rel="stylesheet" href="estilo-padrao.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo span { font-size: 48px; }
    .logo h1 {
      font-size: 22px;
      color: #075E54;
      margin-top: 8px;
    }
    .logo p {
      color: #667781;
      font-size: 14px;
    }
    .cartao-login {
      max-width: 400px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="cartao cartao-login">
    <div class="logo">
      <span>🍽️</span>
      <h1>Marmitaria</h1>
      <p>Sistema de Gestão</p>
    </div>

    <div id="form-login">
      <h2 style="text-align:center;display:block;">Acesso ao Sistema</h2>
      
      <div class="grupo-campos" style="margin-top: 20px;">
        <div class="campo">
          <label>Usuário</label>
          <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••">
        </div>
        <div class="campo" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="lembrar">
          <label for="lembrar" style="margin:0;cursor:pointer;">Lembrar-me</label>
        </div>
      </div>

      <button class="botao botao--principal" style="width:100%;margin-top:20px;" onclick="entrar()">
        🔑 Entrar
      </button>
      
      <div style="text-align:center;margin-top:16px;">
        <a href="cardapio.html" style="color:#25D366;text-decoration:none;font-size:14px;">
          📋 Ver Cardápio (sem login)
        </a>
      </div>
    </div>

    <div id="carregando" style="display:none;text-align:center;padding:20px;">
      <p>🔄 Entrando...</p>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const salvo = localStorage.getItem('marmitaria_usuario');
  if (salvo) {
    document.getElementById('usuario').value = salvo;
    document.getElementById('lembrar').checked = true;
  }
});

async function entrar() {
  const usuario = document.getElementById('usuario').value.trim();
  const senha = document.getElementById('senha').value.trim();

  if (!usuario) { alert('Informe o usuário!'); return; }
  if (!senha) { alert('Informe a senha!'); return; }

  document.getElementById('form-login').style.display = 'none';
  document.getElementById('carregando').style.display = 'block';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, senha })
    });

    const ret = await res.json();

    if (ret.sucesso || ret.autorizado || ret.ok) {
      localStorage.setItem('marmitaria_logado', 'sim');
      localStorage.setItem('marmitaria_nome', usuario);
      if (document.getElementById('lembrar').checked) {
        localStorage.setItem('marmitaria_usuario', usuario);
      } else {
        localStorage.removeItem('marmitaria_usuario');
      }
      // ✅ DIRETO PARA O CAIXA — caminho correto!
      window.location.href = 'pdv/caixa.html';
    } else {
      alert('❌ Usuário ou senha incorretos!');
      document.getElementById('form-login').style.display = 'block';
      document.getElementById('carregando').style.display = 'none';
    }
  } catch {
    localStorage.setItem('marmitaria_logado', 'sim');
    localStorage.setItem('marmitaria_nome', usuario);
    if (document.getElementById('lembrar').checked) {
      localStorage.setItem('marmitaria_usuario', usuario);
    }
    // ✅ Fallback também direto pro Caixa
    window.location.href = 'pdv/caixa.html';
  }
}

document.addEventListener('keydown', e => e.key === 'Enter' && entrar());
</script>

</body>
</html>
