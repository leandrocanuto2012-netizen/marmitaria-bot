<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cardápio — Marmitaria</title>
  <link rel="stylesheet" href="estilo-padrao.css">
</head>
<body>

  <main class="container">
    <a href="cardapio.html" class="voltar">← Voltar para o Cardápio</a>

    <header class="cabecalho" style="margin-bottom: 20px;">
      <h1>⚙️ Editar Cardápio do Dia</h1>
      <p>Altere os itens e atualize para os clientes em tempo real</p>
    </header>

    <!-- FORMULÁRIO — Adicionar / Editar -->
    <div class="cartao">
      <h2 id="titulo-form">Adicionar Novo Item</h2>
      <input type="hidden" id="item-id">
      
      <div class="grupo-campos">
        <div class="linha">
          <div class="campo">
            <label>Data</label>
            <input type="date" id="item-data">
          </div>
          <div class="campo">
            <label>Categoria</label>
            <select id="item-categoria">
              <option value="Prato Principal">🍽️ Prato Principal</option>
              <option value="Bebidas">🥤 Bebidas</option>
              <option value="Sobremesas">🍮 Sobremesas</option>
              <option value="Outros">📦 Outros</option>
            </select>
          </div>
        </div>
        
        <div class="linha">
          <div class="campo">
            <label>Nome do Prato *</label>
            <input type="text" id="item-nome" placeholder="Ex: Feijoada Completa" required>
          </div>
          <div class="campo">
            <label>Preço R$ *</label>
            <input type="number" step="0.01" id="item-preco" placeholder="0.00" required>
          </div>
        </div>
        
        <div class="campo">
          <label>Descrição / Ingredientes</label>
          <textarea id="item-desc" rows="2" placeholder="Arroz, feijão, carne, farofa..."></textarea>
        </div>
        
        <div class="linha">
          <div class="campo">
            <label>Ordem de Exibição</label>
            <input type="number" id="item-ordem" value="0" min="0">
          </div>
          <div class="campo" style="display: flex; align-items: flex-end; padding-bottom: 10px;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
              <input type="checkbox" id="item-disponivel" checked>
              Disponível no cardápio
            </label>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="botao botao--principal" onclick="salvarItem()">✅ Salvar</button>
        <button class="botao botao--secundario" id="btn-cancelar" onclick="cancelarEdicao()" style="display: none;">❌ Cancelar</button>
      </div>
    </div>

    <!-- LISTA DE ITENS COM AÇÕES -->
    <div class="cartao">
      <h2 id="titulo-lista">Itens do Dia</h2>
      <div class="campo" style="margin-bottom: 15px;">
        <label>Filtrar por Data</label>
        <input type="date" id="filtro-data-lista" onchange="carregarItens()">
      </div>
      
      <div id="lista-itens">
        <p style="color: var(--wa-texto-sec); text-align: center; padding: 20px;">Carregando...</p>
      </div>
    </div>
  </main>

<script>
const hoje = new Date().toISOString().split('T')[0];
document.getElementById('item-data').value = hoje;
document.getElementById('filtro-data-lista').value = hoje;

// ==========================================
// CARREGAR LISTA
// ==========================================
async function carregarItens() {
  const data = document.getElementById('filtro-data-lista').value;
  const res = await fetch(`/api/cardapio-dia?data=${data}`);
  const itens = await res.json();
  const lista = document.getElementById('lista-itens');
  
  if (!itens.length) {
    lista.innerHTML = '<p style="color: var(--wa-texto-sec); text-align: center; padding: 20px;">📭 Nenhum item cadastrado para esta data</p>';
    return;
  }

  // Agrupar por categoria
  const agrupado = {};
  itens.forEach(item => {
    if (!agrupado[item.categoria]) agrupado[item.categoria] = [];
    agrupado[item.categoria].push(item);
  });

  lista.innerHTML = '';
  for (const [categoria, itensCat] of Object.entries(agrupado)) {
    lista.innerHTML += `<h3 style="margin: 16px 0 8px; color: var(--wa-cabecalho);">${categoria}</h3>`;
    
    itensCat.forEach(item => {
      lista.innerHTML += `
        <div style="background: ${item.disponivel ? 'var(--wa-branco)' : '#F3F4F6'}; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--wa-borda); ${!item.disponivel ? 'opacity: 0.7;' : ''}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="flex: 1;">
              <div style="font-weight: 600; font-size: 15px; ${!item.disponivel ? 'text-decoration: line-through;' : ''}">
                ${item.nome}
                ${!item.disponivel ? '<span style="color: var(--wa-erro); font-size: 12px; margin-left: 8px;">Indisponível</span>' : ''}
              </div>
              ${item.descricao ? `<div style="font-size: 13px; color: var(--wa-texto-sec); margin-top: 2px;">${item.descricao}</div>` : ''}
              <div style="font-weight: 700; color: var(--wa-cabecalho); margin-top: 4px;">R$ ${Number(item.preco).toFixed(2)}</div>
            </div>
            <div style="display: flex; gap: 6px; margin-left: 10px;">
              <button class="botao botao--secundario" style="padding: 6px 10px; font-size: 12px;" onclick="editarItem('${item.id}')">✏️ Editar</button>
              <button class="botao botao--perigo" style="padding: 6px 10px; font-size: 12px;" onclick="excluirItem('${item.id}', '${item.nome}')">🗑️ Excluir</button>
            </div>
          </div>
        </div>
      `;
    });
  }
}

// ==========================================
// EDITAR — Carrega dados no formulário
// ==========================================
async function editarItem(id) {
  const data = document.getElementById('filtro-data-lista').value;
  const res = await fetch(`/api/cardapio-dia?data=${data}`);
  const itens = await res.json();
  const item = itens.find(i => i.id === id);
  
  if (!item) return;

  // Preenche formulário
  document.getElementById('item-id').value = item.id;
  document.getElementById('item-data').value = item.data || data;
  document.getElementById('item-nome').value = item.nome;
  document.getElementById('item-desc').value = item.descricao || '';
  document.getElementById('item-preco').value = item.preco;
  document.getElementById('item-categoria').value = item.categoria;
  document.getElementById('item-ordem').value = item.ordem || 0;
  document.getElementById('item-disponivel').checked = item.disponivel;

  // Muda para modo edição
  document.getElementById('titulo-form').textContent = '✏️ Editar Item';
  document.getElementById('btn-cancelar').style.display = 'inline-flex';
  
  // Rola até o formulário
  document.getElementById('item-nome').focus();
}

// ==========================================
// CANCELAR EDIÇÃO
// ==========================================
function cancelarEdicao() {
  document.getElementById('item-id').value = '';
  document.getElementById('item-nome').value = '';
  document.getElementById('item-desc').value = '';
  document.getElementById('item-preco').value = '';
  document.getElementById('item-ordem').value = '0';
  document.getElementById('item-disponivel').checked = true;
  document.getElementById('titulo-form').textContent = 'Adicionar Novo Item';
  document.getElementById('btn-cancelar').style.display = 'none';
}

// ==========================================
// SALVAR — Criar ou Atualizar
// ==========================================
async function salvarItem() {
  const id = document.getElementById('item-id').value;
  const nome = document.getElementById('item-nome').value.trim();
  const preco = parseFloat(document.getElementById('item-preco').value);
  
  if (!nome || !preco) {
    alert('⚠️ Preencha o Nome e o Preço!');
    return;
  }

  const dados = {
    data: document.getElementById('item-data').value,
    nome: nome,
    descricao: document.getElementById('item-desc').value.trim(),
    preco: preco,
    categoria: document.getElementById('item-categoria').value,
    ordem: parseInt(document.getElementById('item-ordem').value) || 0,
    disponivel: document.getElementById('item-disponivel').checked
  };

  const res = await fetch('/api/cardapio-dia/salvar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados)
  });

  const ret = await res.json();
  
  if (ret.sucesso) {
    alert(id ? '✅ Item atualizado!' : '✅ Item adicionado!');
    cancelarEdicao();
    // Sincroniza filtro com data do item
    document.getElementById('filtro-data-lista').value = dados.data;
    carregarItens();
  } else {
    alert('❌ Erro: ' + (ret.erro || 'Verifique os dados'));
  }
}

// ==========================================
// EXCLUIR
// ==========================================
async function excluirItem(id, nome) {
  if (!confirm(`🗑️ Tem certeza que deseja excluir:\n"${nome}"\n\nEsta ação não pode ser desfeita!`)) {
    return;
  }

  const res = await fetch('/api/cardapio-dia/excluir', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id })
  });

  const ret = await res.json();
  
  if (ret.sucesso) {
    alert('✅ Item excluído!');
    carregarItens();
  } else {
    alert('❌ Erro ao excluir: ' + (ret.erro || 'Tente novamente'));
  }
}

// Inicializar
carregarItens();
</script>
</body>
</html>
