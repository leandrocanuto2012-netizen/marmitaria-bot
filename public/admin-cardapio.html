<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cardápio — Marmitaria</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: #f0f2f5; padding: 20px; max-width: 900px; margin: 0 auto; }
    .cabecalho { background: #075E54; color: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px; }
    .cabecalho h1 { font-size: 18px; }
    .form-cardapio { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-cardapio h2 { font-size: 16px; margin-bottom: 15px; color: #111; }
    .linha { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .campo { flex: 1; min-width: 180px; }
    .campo label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    .campo input, .campo select, .campo textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-verde { background: #25D366; color: white; }
    .btn-verde:hover { background: #1fb85c; }
    .btn-cinza { background: #e5e7eb; color: #333; }
    .item-lista { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-info div { font-size: 14px; }
    .item-nome { font-weight: 600; }
    .item-preco { color: #075E54; font-weight: 700; }
    .acoes button { margin-left: 6px; padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-excluir { background: #fee2e2; color: #dc2626; }
    .voltar { display: inline-block; margin-bottom: 15px; color: #075E54; text-decoration: none; }
  </style>
</head>
<body>

  <a href="cardapio.html" class="voltar">← Voltar para o Cardápio</a>

  <div class="cabecalho">
    <h1>⚙️ Editar Cardápio do Dia</h1>
  </div>

  <div class="form-cardapio">
    <h2>Adicionar/Editar Item</h2>
    <div class="linha">
      <div class="campo">
        <label>Data</label>
        <input type="date" id="item-data">
      </div>
      <div class="campo">
        <label>Categoria</label>
        <select id="item-categoria">
          <option value="Prato Principal">🍽️ Prato Principal</option>
          <option value="Bebidas">🥤 Bebidas</option>
          <option value="Sobremesas">🍮 Sobremesas</option>
          <option value="Outros">📦 Outros</option>
        </select>
      </div>
    </div>
    <div class="linha">
      <div class="campo">
        <label>Nome do Prato</label>
        <input type="text" id="item-nome" placeholder="Ex: Feijoada Completa">
      </div>
      <div class="campo">
        <label>Preço R$</label>
        <input type="number" step="0.01" id="item-preco" placeholder="0.00">
      </div>
    </div>
    <div class="linha">
      <div class="campo" style="flex: 2;">
        <label>Descrição / Ingredientes</label>
        <textarea id="item-desc" rows="2" placeholder="Arroz, feijão, carne, farofa..."></textarea>
      </div>
    </div>
    <button class="btn btn-verde" onclick="salvarItem()">✅ Salvar no Cardápio</button>
  </div>

  <div class="form-cardapio">
    <h2>Itens do Dia</h2>
    <div id="lista-itens"></div>
  </div>

<script>
const hoje = new Date().toISOString().split('T')[0];
document.getElementById('item-data').value = hoje;

async function carregarItens() {
  const data = document.getElementById('item-data').value;
  const res = await fetch(`/api/cardapio-dia?data=${data}`);
  const itens = await res.json();
  const lista = document.getElementById('lista-itens');
  
  if (!itens.length) {
    lista.innerHTML = '<p style="color:#888;text-align:center;padding:20px">Nenhum item cadastrado para esta data</p>';
    return;
  }

  lista.innerHTML = '';
  itens.forEach(item => {
    lista.innerHTML += `
      <div class="item-lista">
        <div class="item-info">
          <div class="item-nome">${item.nome}</div>
          <div style="font-size:12px;color:#666">${item.categoria} · ${item.descricao || 'Sem descrição'}</div>
        </div>
        <div class="item-preco">R$ ${Number(item.preco).toFixed(2)}</div>
      </div>
    `;
  });
}

async function salvarItem() {
  const dados = {
    data: document.getElementById('item-data').value,
    nome: document.getElementById('item-nome').value.trim(),
    descricao: document.getElementById('item-desc').value.trim(),
    preco: parseFloat(document.getElementById('item-preco').value) || 0,
    categoria: document.getElementById('item-categoria').value
  };

  if (!dados.nome || !dados.preco) {
    alert('Preencha nome e preço!');
    return;
  }

  const res = await fetch('/api/cardapio-dia/salvar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dados)
  });

  const ret = await res.json();
  if (ret.sucesso) {
    alert('✅ Salvo!');
    document.getElementById('item-nome').value = '';
    document.getElementById('item-desc').value = '';
    document.getElementById('item-preco').value = '';
    carregarItens();
  } else {
    alert('Erro: ' + ret.erro);
  }
}

document.getElementById('item-data').addEventListener('change', carregarItens);
carregarItens();
</script>
</body>
</html>
