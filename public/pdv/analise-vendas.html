<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise de Vendas — Marmitária</title>
  <style>
    * {margin:0; padding:0; font-family: system-ui; box-sizing: border-box;}
    body {background: #f5f5f5; padding: 20px; max-width: 900px; margin: 0 auto;}
    h1 {color: #2d3436; margin-bottom: 20px;}
    .card {background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);}
    h2 {font-size: 18px; margin-bottom: 15px; color: #d35400;}
    .dia-selecionado {background: #e3f2fd; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #1976d2;}
    .semana {margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px;}
    .semana-titulo {font-weight: bold; color: #555; margin-bottom: 8px; display: flex; justify-content: space-between;}
    .item-venda {padding: 10px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;}
    .mais-vendido {background: #fff3cd; border-left: 3px solid #ffc107; padding: 10px; border-radius: 6px; margin: 8px 0;}
    .comparativo {display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 15px 0;}
    .card-semana {background: #f9f9f9; padding: 12px; border-radius: 8px; text-align: center;}
    .card-semana .valor {font-size: 1.4em; font-weight: bold; color: #27ae60;}
    .card-semana .data {font-size: 12px; color: #888; margin-top: 4px;}
    .card-semana.atual {background: #e8f5e9; border: 2px solid #27ae60;}
    .variacao {font-size: 13px; margin-top: 5px; font-weight: bold;}
    .positivo {color: #27ae60;}
    .negativo {color: #e74c3c;}
    .voltar {display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none;}
    select {padding: 10px; border-radius: 6px; border: 1px solid #ddd; font-size: 15px; width: 100%; max-width: 300px;}
    .resumo-geral {display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px;}
    .resumo-item {flex:1; min-width: 150px; background: #fafafa; padding: 15px; border-radius: 8px; text-align: center;}
    .resumo-item .numero {font-size: 1.5em; font-weight: bold; color: #d35400;}
    .ranking {margin-top: 20px;}
    .ranking-item {padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;}
    .ranking-pos {font-weight: bold; color: #d35400; width: 25px; display: inline-block;}
  </style>
</head>
<body>
  <a href="caixa.html" class="voltar">← Voltar ao Caixa</a>
  <h1>📊 Análise de Vendas por Dia</h1>

  <div class="card">
    <h2>📅 Escolher Dia da Semana</h2>
    <select id="diaSemana" onchange="carregarAnalise()">
      <option value="1">Segunda-feira</option>
      <option value="2">Terça-feira</option>
      <option value="3">Quarta-feira</option>
      <option value="4">Quinta-feira</option>
      <option value="5">Sexta-feira</option>
      <option value="6">Sábado</option>
      <option value="0">Domingo</option>
    </select>
    
    <div class="dia-selecionado">
      <strong id="nomeDia">Segunda-feira</strong> — Comparativo das últimas 4 semanas
    </div>

    <div class="comparativo" id="comparativoSemanas"></div>

    <div class="resumo-geral">
      <div class="resumo-item">
        <div class="numero" id="mediaGeral">R$ 0</div>
        <div>Média de Vendas</div>
      </div>
      <div class="resumo-item">
        <div class="numero" id="crescimento">0%</div>
        <div>vs Semana Anterior</div>
      </div>
      <div class="resumo-item">
        <div class="numero" id="qtdDias">0</div>
        <div>Semanas Analisadas</div>
      </div>
    </div>
  </div>

  <div class="card ranking">
    <h2>🏆 Mais Vendido neste Dia</h2>
    <p style="color:#666; margin-bottom:10px;">Prato que mais vende nas <span id="tituloDia">Segundas</span></p>
    <div id="rankingItens"></div>
  </div>

  <script>
    const nomesDias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];

    async function carregarAnalise() {
      const diaSemana = parseInt(document.getElementById('diaSemana').value);
      document.getElementById('nomeDia').innerText = nomesDias[diaSemana];
      document.getElementById('tituloDia').innerText = nomesDias[diaSemana] + 's';

      const res = await fetch(`/api/analise-vendas?dia_semana=${diaSemana}`);
      const dados = await res.json();
      
      // Comparativo das últimas 4 semanas
      const container = document.getElementById('comparativoSemanas');
      container.innerHTML = dados.semanas.map((sem, idx) => {
        const ehAtual = idx === 0;
        return `
          <div class="card-semana ${ehAtual ? 'atual' : ''}">
            <div>${sem.data}</div>
            <div class="valor">R$ ${sem.valor_total.toFixed(2)}</div>
            <div>${sem.qtd_pedidos} pedidos</div>
            ${!ehAtual && dados.variacao ? `
              <div class="variacao ${dados.variacao[idx-1] >= 0 ? 'positivo' : 'negativo'}">
                ${dados.variacao[idx-1] >= 0 ? '↑' : '↓'} ${dados.variacao[idx-1].toFixed(1)}%
              </div>
            ` : ''}
            <div class="data">${ehAtual ? '🔵 Atual' : ''}</div>
          </div>
        `;
      }).join('');

      // Resumo
      document.getElementById('mediaGeral').innerText = `R$ ${dados.media_geral.toFixed(2)}`;
      document.getElementById('crescimento').innerText = `${dados.crescimento >= 0 ? '+' : ''}${dados.crescimento.toFixed(1)}%`;
      document.getElementById('crescimento').className = `numero ${dados.crescimento >= 0 ? 'positivo' : 'negativo'}`;
      document.getElementById('qtdDias').innerText = dados.semanas.length;

      // Ranking de produtos
      const rankContainer = document.getElementById('rankingItens');
      if (dados.ranking.length === 0) {
        rankContainer.innerHTML = '<p style="color:#888; padding:10px;">Sem dados suficientes ainda. Venda mais para aparecer!</p>';
      } else {
        rankContainer.innerHTML = dados.ranking.map((item, pos) => `
          <div class="ranking-item ${pos === 0 ? 'mais-vendido' : ''}">
            <span><span class="ranking-pos">${pos+1}º</span> ${item.nome}</span>
            <strong>R$ ${item.total.toFixed(2)} (${item.qtd}x)</strong>
          </div>
        `).join('');
      }
    }

    carregarAnalise();
  </script>
</body>
</html>
