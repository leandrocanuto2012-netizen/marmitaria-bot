<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Insumos — Marmitária</title>
  <style>
    * {margin:0; padding:0; font-family: system-ui; box-sizing: border-box;}
    body {background: #f5f5f5; padding: 20px; max-width: 900px; margin: 0 auto;}
    h1 {color: #2d3436; margin-bottom: 20px;}
    .card {background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);}
    h2 {font-size: 18px; margin-bottom: 15px; color: #d35400;}
    input, button, select {padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; font-size: 15px;}
    button {background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer;}
    button.vermelho {background: #e74c3c;}
    button.azul {background: #3498db;}
    .insumo-linha {display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee;}
    .insumo-linha input {flex:1; min-width: 100px; margin: 0;}
    .resultado {background: #e8f5e9; border-left: 5px solid #27ae60; padding: 15px; border-radius: 8px; margin-top: 15px;}
    .custo-total {font-size: 1.8em; font-weight: bold; color: #27ae60; margin: 10px 0;}
    .preco-sugerido {font-size: 1.4em; color: #d35400;}
    .margem {color: #555; font-size: 14px; margin-top: 5px;}
    .voltar {display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none;}
    .salvo {background: #e3f2fd; border-left: 5px solid #1976d2; padding: 10px; border-radius: 6px; margin-top: 10px; display: none;}
    .lista-produtos {margin-top: 20px;}
    .produto-item {padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;}
  </style>
</head>
<body>
  <a href="caixa.html" class="voltar">← Voltar ao Caixa</a>
  <h1>🧮 Calculadora de Insumos & Custos</h1>

  <div class="card">
    <h2>➕ Novo Cálculo de Prato</h2>
    <input type="text" id="nomePrato" placeholder="Nome do Prato" required style="font-size:16px;">
    
    <div id="listaInsumos">
      <div class="insumo-linha">
        <input type="text" placeholder="Insumo" class="insumo-nome">
        <input type="number" placeholder="Qtd g" class="insumo-qtd" style="width:90px;">
        <input type="number" placeholder="Preço/kg" class="insumo-preco" style="width:110px;">
        <button class="vermelho" onclick="removerLinha(this)" style="width:32px; padding:6px;">−</button>
      </div>
    </div>
    
    <button class="azul" onclick="adicionarLinha()" style="margin:10px 0;">+ Adicionar Insumo</button>
    
    <div style="display:flex; gap:10px; margin-top:10px;">
      <input type="number" id="margemLucro" placeholder="Margem %" value="60" style="width:120px;">
      <button onclick="calcular()">🧾 Calcular Custos</button>
      <button onclick="salvarNoCardapio()" style="background:#f39c12;">💾 Salvar no Cardápio</button>
    </div>

    <div class="resultado" id="resultado" style="display:none;">
      <h3>📊 Cálculo — <span id="resNome"></span></h3>
      <div class="custo-total">Custo: R$ <span id="resCusto">0,00</span></div>
      <div class="preco-sugerido">Preço de Venda: R$ <span id="resPreco">0,00</span></div>
      <div class="margem">Margem: <span id="resMargem">60</span>% | Lucro: R$ <span id="resLucro">0,00</span></div>
      <div class="salvo" id="avisoSalvo">✅ Salvo no cardápio com sucesso!</div>
    </div>
  </div>

  <div class="card lista-produtos">
    <h2>📋 Custos Cadastrados</h2>
    <div id="listaCadastrados"></div>
  </div>

  <script>
    let ultimoCalculo = null;

    function adicionarLinha() {
      const container = document.getElementById('listaInsumos');
      const linha = document.createElement('div');
      linha.className = 'insumo-linha';
      linha.innerHTML = `
        <input type="text" placeholder="Insumo" class="insumo-nome">
        <input type="number" placeholder="Qtd g" class="insumo-qtd" style="width:90px;">
        <input type="number" placeholder="Preço/kg" class="insumo-preco" style="width:110px;">
        <button class="vermelho" onclick="removerLinha(this)" style="width:32px; padding:6px;">−</button>
      `;
      container.appendChild(linha);
    }

    function removerLinha(btn) {
      const linhas = document.querySelectorAll('.insumo-linha');
      if (linhas.length > 1) btn.parentElement.remove();
    }

    function calcular() {
      const linhas = document.querySelectorAll('.insumo-linha');
      let custoTotal = 0;
      const detalhes = [];

      linhas.forEach(linha => {
        const nome = linha.querySelector('.insumo-nome').value.trim() || 'Insumo';
        const qtdGramas = parseFloat(linha.querySelector('.insumo-qtd').value) || 0;
        const precoKg = parseFloat(linha.querySelector('.insumo-preco').value) || 0;
        
        if (qtdGramas > 0 && precoKg > 0) {
          const custoItem = (qtdGramas / 1000) * precoKg;
          custoTotal += custoItem;
          detalhes.push({nome, qtdGramas, precoKg, custoItem});
        }
      });

      const margem = parseFloat(document.getElementById('margemLucro').value) || 60;
      const fator = 1 / (1 - margem / 100);
      const precoVenda = custoTotal * fator;
      const lucro = precoVenda - custoTotal;
      const nomePrato = document.getElementById('nomePrato').value.trim() || 'Prato';

      ultimoCalculo = {nome: nomePrato, custo: custoTotal, preco: precoVenda, margem, detalhes};

      document.getElementById('resNome').innerText = nomePrato;
      document.getElementById('resCusto').innerText = custoTotal.toFixed(2);
      document.getElementById('resPreco').innerText = precoVenda.toFixed(2);
      document.getElementById('resMargem').innerText = margem;
      document.getElementById('resLucro').innerText = lucro.toFixed(2);
      document.getElementById('resultado').style.display = 'block';
      document.getElementById('avisoSalvo').style.display = 'none';
    }

    async function salvarNoCardapio() {
      if (!ultimoCalculo) return alert('Primeiro faça o cálculo!');
      
      await fetch('/api/produtos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          nome: ultimoCalculo.nome,
          categoria: 'Refeições',
          preco: parseFloat(ultimoCalculo.preco.toFixed(2)),
          estoque_atual: 50,
          descricao: `Custo: R$ ${ultimoCalculo.custo.toFixed(2)} | Margem: ${ultimoCalculo.margem}%`
        })
      });
      
      document.getElementById('avisoSalvo').style.display = 'block';
      carregarCadastrados();
    }

    async function carregarCadastrados() {
      const res = await fetch('/api/produtos');
      const produtos = await res.json();
      const lista = document.getElementById('listaCadastrados');
      
      lista.innerHTML = produtos.length === 0 
        ? '<p style="color:#888; padding:10px;">Nenhum produto cadastrado</p>'
        : produtos.map(p => {
            const temCusto = p.descricao && p.descricao.includes('Custo:');
            return `
              <div class="produto-item">
                <div>
                  <strong>${p.nome}</strong><br>
                  <small style="color:#666;">${p.categoria || '-'}</small>
                  ${temCusto ? `<br><small style="color:#27ae60;">${p.descricao}</small>` : ''}
                </div>
                <div style="text-align:right;">
                  <strong style="color:#d35400;">R$ ${parseFloat(p.preco).toFixed(2)}</strong>
                </div>
              </div>
            `;
          }).join('');
    }

    carregarCadastrados();
  </script>
</body>
</html>
