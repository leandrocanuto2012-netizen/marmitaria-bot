<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caixa / PDV — Marmitaria</title>
  <link rel="stylesheet" href="estilo-padrao.css">
</head>
<body>

  <header class="cabecalho">
    <h1>💰 Caixa / PDV</h1>
    <p>Controle de vendas e movimento diário</p>
  </header>

  <main class="container">

    <!-- STATUS DO CAIXA -->
    <div id="status-caixa" class="cartao cartao--alerta">
      <div class="status status--erro" id="etiqueta-status">
        🔴 CAIXA FECHADO — Informe o operador
      </div>
    </div>

    <!-- ABRIR CAIXA -->
    <div id="area-abrir" class="cartao">
      <h2>Abrir Caixa</h2>
      <div class="grupo-campos">
        <div class="campo">
          <label for="operador">Nome do Operador</label>
          <input type="text" id="operador" placeholder="Digite seu nome">
        </div>
        <div class="campo">
          <label for="saldo-inicial">Saldo Inicial R$</label>
          <input type="number" step="0.01" id="saldo-inicial" value="0.00">
        </div>
      </div>
      <button class="botao botao--principal" onclick="abrirCaixa()">🔓 Abrir Caixa</button>
    </div>

    <!-- VENDAS — SÓ APARECE COM CAIXA ABERTO -->
    <div id="area-vendas" style="display: none;">
      
      <div class="linha" style="margin: 16px 0;">
        <button class="botao botao--secundario" id="btn-vendas" onclick="abaVendas()">📋 Vendas</button>
        <button class="botao botao--principal" id="btn-manual" onclick="abaManual()">✍️ Venda Manual</button>
        <button class="botao botao--secundario" id="btn-registros" onclick="abaRegistros()">📊 Registros</button>
      </div>

      <!-- ABA: VENDA MANUAL -->
      <div id="form-manual" class="cartao">
        <h2>Lançar Venda</h2>
        
        <div class="grupo-campos">
          <div class="campo">
            <label>Cliente</label>
            <select id="cliente-tipo" onchange="trocarCliente()">
              <option value="ficticio">Não informado (consumidor)</option>
              <option value="cadastrado">Já cadastrado</option>
              <option value="novo">Cadastrar agora</option>
            </select>
          </div>
          
          <div class="campo" id="campo-nome" style="display: none;">
            <label>Nome do Cliente</label>
            <input type="text" id="cliente-nome" placeholder="Nome">
          </div>
          
          <div class="campo" id="campo-telefone" style="display: none;">
            <label>Telefone (opcional)</label>
            <input type="tel" id="cliente-tel" placeholder="(XX) XXXXX-XXXX">
          </div>
          
          <div class="campo">
            <label>Tipo de Entrega</label>
            <select id="tipo-entrega">
              <option value="balcao">Retirada no Balcão</option>
              <option value="entrega">Entrega</option>
              <option value="consumir">Consumir no local</option>
            </select>
          </div>
        </div>

        <h3 style="margin-top: 16px;">Itens do Pedido</h3>
        <div id="lista-itens-pedido" class="grupo-campos"></div>

        <div class="linha" style="margin: 12px 0; align-items: flex-end;">
          <div class="campo">
            <label>Produto</label>
            <select id="produto-nome">
              <option value="">Carregando...</option>
            </select>
          </div>
          <div class="campo" style="max-width: 90px;">
            <label>Quantidade</label>
            <input type="number" id="produto-qtd" value="1" min="1">
          </div>
          <div class="campo" style="max-width: 130px;">
            <label>Preço Unitário R$</label>
            <input type="number" step="0.01" id="produto-preco" placeholder="0.00" readonly>
          </div>
          <button class="botao botao--principal" onclick="adicionarItem()">+</button>
        </div>

        <div class="campo">
          <label>Observações (opcional)</label>
          <textarea id="obs" rows="2" placeholder="Ex: Sem cebola, bem passado..."></textarea>
        </div>

        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--wa-borda);">
          <strong>Total: <span id="valor-total" class="valor-destaque">R$ 0,00</span></strong>
        </div>

        <button class="botao botao--principal" style="width: 100%; margin-top: 16px;" onclick="finalizarVenda()">✅ Finalizar Venda</button>
        <button class="botao botao--perigo" style="width: 100%; margin-top: 8px;" onclick="fecharCaixa()">🔒 Fechar Caixa</button>
      </div>

      <!-- ABA: REGISTROS -->
      <div id="area-registros" class="cartao" style="display: none;">
        <h2>Resumo do Caixa</h2>
        <div id="dados-caixa"></div>
        <h3 style="margin-top: 20px;">Últimas Vendas</h3>
        <div id="lista-vendas"></div>
      </div>
    </div>

    <a href="dashboard.html" class="voltar" style="margin-top: 20px;">← Voltar ao Painel Principal</a>
  </main>

<script>
let itensPedido = [];
let produtosLista = [];

document.addEventListener('DOMContentLoaded', () => {
  carregarProdutos();
  verificarCaixaAberto();
});

async function carregarProdutos() {
  try {
    const res = await fetch('/api/produtos/lista');
    produtosLista = await res.json();
    const sel = document.getElementById('produto-nome');
    sel.innerHTML = '<option value="">Selecione...</option>';
    produtosLista.forEach(p => {
      sel.innerHTML += `<option value="${p.nome}" data-preco="${p.preco}">${p.nome} — R$ ${Number(p.preco).toFixed(2)}</option>`;
    });
    sel.addEventListener('change', () => {
      const opt = sel.selectedOptions[0];
      if (opt.dataset.preco) {
        document.getElementById('produto-preco').value = opt.dataset.preco;
      }
    });
  } catch (e) {
    console.error('Erro produtos:', e);
  }
}

async function verificarCaixaAberto() {
  const res = await fetch('/api/resumo');
  const dados = await res.json();
  if (dados.caixaAberto) caixaAberto(dados.caixaAberto);
  else caixaFechado();
}

function caixaAberto(caixa) {
  document.getElementById('etiqueta-status').className = 'status status--aberto';
  document.getElementById('etiqueta-status').innerHTML = `✅ CAIXA ABERTO — Operador: ${caixa.operator_name || caixa.operador}`;
  document.getElementById('area-abrir').style.display = 'none';
  document.getElementById('area-vendas').style.display = 'block';
}

function caixaFechado() {
  document.getElementById('etiqueta-status').className = 'status status--erro';
  document.getElementById('etiqueta-status').innerHTML = '🔴 CAIXA FECHADO — Informe o operador';
  document.getElementById('area-abrir').style.display = 'block';
  document.getElementById('area-vendas').style.display = 'none';
}

async function abrirCaixa() {
  const operador = document.getElementById('operador').value.trim();
  const saldo = parseFloat(document.getElementById('saldo-inicial').value) || 0;
  if (!operador) { alert('Informe o nome do operador!'); return; }

  const res = await fetch('/api/caixa/abrir', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ operador, saldo_inicial: saldo })
  });

  const ret = await res.json();
  if (ret.sucesso) { alert('✅ Caixa aberto!'); caixaAberto(ret.caixa); }
  else alert('❌ ' + (ret.erro || 'Erro ao abrir'));
}

async function fecharCaixa() {
  const saldoContado = prompt('Saldo contado em caixa R$:');
  if (!saldoContado) return;
  const res = await fetch('/api/caixa/fechar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ saldo_contado: parseFloat(saldoContado), saldo_sistema: 0, diferenca: 0 })
  });
  const ret = await res.json();
  if (ret.sucesso) { alert('✅ Caixa fechado!'); location.href = 'dashboard.html'; }
  else alert('❌ ' + ret.erro);
}

function abaVendas() {
  document.getElementById('form-manual').style.display = 'none';
  document.getElementById('area-registros').style.display = 'none';
  document.getElementById('btn-vendas').className = 'botao botao--principal';
  document.getElementById('btn-manual').className = 'botao botao--secundario';
  document.getElementById('btn-registros').className = 'botao botao--secundario';
}
function abaManual() {
  document.getElementById('form-manual').style.display = 'block';
  document.getElementById('area-registros').style.display = 'none';
  document.getElementById('btn-vendas').className = 'botao botao--secundario';
  document.getElementById('btn-manual').className = 'botao botao--principal';
  document.getElementById('btn-registros').className = 'botao botao--secundario';
}
function abaRegistros() {
  document.getElementById('form-manual').style.display = 'none';
  document.getElementById('area-registros').style.display = 'block';
  carregarRegistros();
  document.getElementById('btn-vendas').className = 'botao botao--secundario';
  document.getElementById('btn-manual').className = 'botao botao--secundario';
  document.getElementById('btn-registros').className = 'botao botao--principal';
}

function trocarCliente() {
  const tipo = document.getElementById('cliente-tipo').value;
  document.getElementById('campo-nome').style.display = tipo === 'ficticio' ? 'none' : 'block';
  document.getElementById('campo-telefone').style.display = tipo === 'ficticio' ? 'none' : 'block';
}

function adicionarItem() {
  const nome = document.getElementById('produto-nome').value;
  const qtd = parseInt(document.getElementById('produto-qtd').value) || 1;
  const preco = parseFloat(document.getElementById('produto-preco').value) || 0;
  if (!nome || preco <= 0) { alert('Selecione um produto!'); return; }

  itensPedido.push({ nome_produto: nome, quantidade: qtd, preco_unitario: preco });
  atualizarListaItens();
  document.getElementById('produto-nome').value = '';
  document.getElementById('produto-qtd').value = '1';
  document.getElementById('produto-preco').value = '';
}

function removerItem(indice) {
  itensPedido.splice(indice, 1);
  atualizarListaItens();
}

function atualizarListaItens() {
  const lista = document.getElementById('lista-itens-pedido');
  lista.innerHTML = '';
  let total = 0;
  itensPedido.forEach((item, i) => {
    const subtotal = item.quantidade * item.preco_unitario;
    total += subtotal;
    lista.innerHTML += `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#f9fafb;border-radius:8px;">
        <div><strong>${item.nome_produto}</strong> × ${item.quantidade} = R$ ${subtotal.toFixed(2)}</div>
        <button class="botao botao--perigo" style="padding:4px 8px;font-size:12px;" onclick="removerItem(${i})">✕</button>
      </div>
    `;
  });
  document.getElementById('valor-total').textContent = `R$ ${total.toFixed(2)}`;
}

async function finalizarVenda() {
  if (!itensPedido.length) { alert('Adicione pelo menos um item!'); return; }
  const tipoCli = document.getElementById('cliente-tipo').value;
  const nomeCli = document.getElementById('cliente-nome').value.trim() || (tipoCli === 'ficticio' ? 'Consumidor' : 'Não informado');
  const telCli = document.getElementById('cliente-tel').value.trim() || '';
  const tipoEntrega = document.getElementById('tipo-entrega').value;
  const obs = document.getElementById('obs').value.trim();
  const valorTotal = itensPedido.reduce((s, i) => s + i.quantidade * i.preco_unitario, 0);

  const res = await fetch('/api/pedidos/manual', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nome_cliente: nomeCli, telefone_cliente: telCli, tipo: tipoEntrega,
      observacao: obs, valor_total: valorTotal, itens: itensPedido, status: 'aberto'
    })
  });

  const ret = await res.json();
  if (ret.sucesso) {
    alert(`✅ Venda registrada!\nPedido: ${ret.id}`);
    imprimirCupom(ret.id, nomeCli, valorTotal, itensPedido);
    itensPedido = []; atualizarListaItens();
    document.getElementById('cliente-nome').value = '';
    document.getElementById('cliente-tel').value = '';
    document.getElementById('obs').value = '';
    carregarRegistros();
  } else alert('❌ Erro: ' + ret.erro);
}

function imprimirCupom(id, nome, total, itens) {
  const data = new Date().toLocaleString('pt-BR');
  const janela = window.open('', '_blank', 'width=320,height=600');
  janela.document.write(`
    <html><head><title>Cupom</title><style>
      body{font-family:monospace;font-size:13px;padding:10px;max-width:300px;margin:0 auto;}
      .centro{text-align:center;}
      .linha{border-bottom:1px dashed #000;padding:4px 0;}
      .dir{text-align:right;}
      .total{font-weight:bold;font-size:16px;}
    </style></head><body>
      <div class="centro"><h3>MARMITARIA</h3></div>
      <div class="linha centro">Pedido: ${id}<br>${data}</div>
      <div>Cliente: ${nome}</div>
      <div class="linha">
        ${itens.map(i => `${i.nome_produto} × ${i.quantidade} = R$ ${(i.quantidade*i.preco_unitario).toFixed(2)}`).join('<br>')}
      </div>
      <div class="linha dir total">TOTAL: R$ ${total.toFixed(2)}</div>
      <div class="centro" style="margin-top:10px;">Obrigado! Volte sempre 😊</div>
    </body></html>
  `);
  janela.document.close();
  janela.print();
}

async function carregarRegistros() {
  const res = await fetch('/api/pedidos');
  const vendas = await res.json();
  const lista = document.getElementById('lista-vendas');
  if (!vendas.length) {
    lista.innerHTML = '<p style="color:var(--wa-texto-sec);text-align:center;padding:20px;">Nenhuma venda registrada</p>';
    return;
  }
  lista.innerHTML = '<table class="tabela"><thead><tr><th>Data</th><th>Cliente</th><th>Total</th></tr></thead><tbody>';
  vendas.slice(0, 10).forEach(v => {
    lista.innerHTML += `
      <tr>
        <td>${new Date(v.created_at).toLocaleDateString('pt-BR')}</td>
        <td>${v.customer_name}</td>
        <td class="valor-destaque">R$ ${Number(v.total_amount).toFixed(2)}</td>
      </tr>
    `;
  });
  lista.innerHTML += '</tbody></table>';
}
</script>
</body>
</html>
