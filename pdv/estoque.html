<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque — Marmitária</title>
  <style>
    * {margin:0; padding:0; font-family: system-ui; box-sizing: border-box;}
    body {background: #f5f5f5; padding: 20px; max-width: 900px; margin: 0 auto;}
    h1 {color: #2d3436; margin-bottom: 20px;}
    .card {background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);}
    h2 {font-size: 18px; margin-bottom: 15px; color: #d35400;}
    form {display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;}
    input, select, button {padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px;}
    button {background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold;}
    button.vermelho {background: #e74c3c;}
    button.azul {background: #3498db;}
    button.pequeno {padding: 5px 10px; font-size: 13px;}
    table {width: 100%; border-collapse: collapse; margin-top: 10px;}
    th, td {padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee;}
    th {background: #f8f9fa; font-weight: 600; color: #444;}
    .baixo {color: #e74c3c; font-weight: bold;}
    .medio {color: #f39c12;}
    .normal {color: #27ae60;}
    .inativo {opacity: 0.5; text-decoration: line-through;}
    .voltar {display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none;}
    .ajuste {display: flex; gap: 5px; align-items: center;}
    .ajuste input {width: 60px; padding: 5px;}
  </style>
</head>
<body>
  <a href="/pdv/caixa.html" class="voltar">← Voltar ao Caixa</a>
  <h1>📦 Controle de Estoque</h1>

  <div class="card">
    <h2>➕ Cadastrar/Editar Produto</h2>
    <form id="formProduto">
      <input type="text" id="prodNome" placeholder="Nome do produto" required style="flex:2; min-width:180px;">
      <input type="text" id="prodDesc" placeholder="Descrição" style="flex:2; min-width:150px;">
      <input type="number" id="prodPreco" placeholder="Preço" step="0.01" required style="width:100px;">
      <input type="text" id="prodCat" placeholder="Categoria" style="width:130px;">
      <input type="number" id="prodEstoque" placeholder="Estoque inicial" style="width:110px;">
      <button type="submit">Salvar</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 Produtos no Estoque</h2>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Estoque</th>
          <th>Categoria</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaEstoque"></tbody>
    </table>
  </div>

  <script>
    async function carregarEstoque() {
      const res = await fetch('/api/produtos');
      const produtos = await res.json();
      const lista = document.getElementById('listaEstoque');
      
      lista.innerHTML = produtos.map(p => {
        let classe = 'normal';
        if (p.estoque_atual <= 5) classe = 'baixo';
        else if (p.estoque_atual <= 15) classe = 'medio';
        
        return `
          <tr class="${p.ativo ? '' : 'inativo'}">
            <td><strong>${p.nome}</strong>${p.descricao ? `<br><small>${p.descricao}</small>` : ''}</td>
            <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
            <td class="${classe}">${p.estoque_atual} un</td>
            <td>${p.categoria || '-'}</td>
            <td>
              <div class="ajuste">
                <input type="number" id="qtd-${p.id}" placeholder="+/-" style="width:50px;">
                <button class="azul pequeno" onclick="ajustarEstoque(${p.id}, 1)">+</button>
                <button class="vermelho pequeno" onclick="ajustarEstoque(${p.id}, -1)">-</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('formProduto').addEventListener('submit', async e => {
      e.preventDefault();
      const dados = {
        nome: document.getElementById('prodNome').value,
        descricao: document.getElementById('prodDesc').value,
        preco: parseFloat(document.getElementById('prodPreco').value),
        categoria: document.getElementById('prodCat').value,
        estoque_atual: parseInt(document.getElementById('prodEstoque').value) || 0
      };

      await fetch('/api/produtos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(dados)
      });

      e.target.reset();
      carregarEstoque();
      alert('✅ Produto cadastrado!');
    });

    async function ajustarEstoque(id, delta) {
      const qtd = parseInt(document.getElementById(`qtd-${id}`).value) || Math.abs(delta);
      const res = await fetch(`/api/produtos/${id}/estoque`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({quantidade: delta * qtd})
      });
      if (res.ok) carregarEstoque();
      else alert('Erro ao ajustar estoque');
    }

    carregarEstoque();
  </script>
</body>
</html>
