<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Marmitária</title>
  <style>
    * {margin:0; padding:0; font-family: system-ui; box-sizing: border-box;}
    body {background: #f5f5f5; padding: 20px; max-width: 900px; margin: 0 auto;}
    h1 {color: #2d3436; margin-bottom: 20px;}
    .pedido {background: white; padding: 18px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);}
    .cabecalho {display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
    .numero {font-weight: bold; font-size: 18px; color: #d35400;}
    .status {padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;}
    .recebido {background: #fff3cd; color: #856404;}
    .preparando {background: #cce5ff; color: #004085;}
    .pronto {background: #d4edda; color: #155724;}
    .entregue {background: #e2e3e5; color: #383d41;}
    .dados {margin: 8px 0; color: #495057;}
    .valor {font-size: 17px; font-weight: bold; color: #27ae60; margin-top: 8px;}
    .acoes {margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap;}
    button {padding: 8px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;}
    .btn-prep {background: #3498db; color: white;}
    .btn-pronto {background: #27ae60; color: white;}
    .btn-entregue {background: #95a5a6; color: white;}
    .atualizar {background: #f39c12; color: white; margin-bottom: 20px; width: 100%;}
    .voltar {display: inline-block; margin-bottom: 15px; color: #d35400; text-decoration: none;}
    .filtros {margin-bottom: 15px;}
    .filtros button {background: white; color: #555; border: 1px solid #ddd; margin-right: 5px; margin-bottom: 5px;}
    .filtros button.ativo {background: #d35400; color: white; border-color: #d35400;}
  </style>
</head>
<body>
  <a href="/pdv/caixa.html" class="voltar">← Voltar ao Caixa</a>
  <h1>🛒 Pedidos Recebidos</h1>
  
  <button class="atualizar" onclick="carregarPedidos()">🔄 Atualizar Lista</button>
  
  <div class="filtros">
    <button class="ativo" data-filtro="todos" onclick="filtrar('todos')">Todos</button>
    <button data-filtro="recebido" onclick="filtrar('recebido')">Recebidos</button>
    <button data-filtro="preparando" onclick="filtrar('preparando')">Preparando</button>
    <button data-filtro="pronto" onclick="filtrar('pronto')">Prontos</button>
    <button data-filtro="entregue" onclick="filtrar('entregue')">Entregues</button>
  </div>

  <div id="listaPedidos"></div>

  <script>
    let pedidos = [];
    let filtroAtivo = 'todos';

    async function carregarPedidos() {
      const res = await fetch('/api/pedidos');
      pedidos = await res.json();
      renderizar();
    }

    function filtrar(filtro) {
      filtroAtivo = filtro;
      document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
      event.target.classList.add('ativo');
      renderizar();
    }

    function renderizar() {
      const lista = document.getElementById('listaPedidos');
      const filtrados = filtroAtivo === 'todos' 
        ? pedidos 
        : pedidos.filter(p => p.status === filtroAtivo);

      lista.innerHTML = filtrados.length === 0 
        ? '<p style="text-align:center; color:#888; padding:20px;">Nenhum pedido encontrado</p>'
        : filtrados.map(p => `
          <div class="pedido">
            <div class="cabecalho">
              <span class="numero">#${p.id}</span>
              <span class="status ${p.status}">${p.status.toUpperCase()}</span>
            </div>
            <div class="dados">
              <strong>${p.nome_cliente || 'Cliente sem nome'}</strong><br>
              📞 ${p.telefone_cliente || 'Não informado'}<br>
              📦 ${p.tipo === 'balcao' ? 'Retirada no Balcão' : p.tipo === 'entrega' ? 'Entrega' : 'Retirada'}<br>
              ${p.observacao ? `📝 ${p.observacao}` : ''}<br>
              🕒 ${new Date(p.created_at).toLocaleTimeString('pt-BR')}
            </div>
            <div class="valor">R$ ${parseFloat(p.valor_total).toFixed(2)}</div>
            <div class="acoes">
              ${p.status === 'recebido' ? `<button class="btn-prep" onclick="mudarStatus(${p.id}, 'preparando')">🔥 Iniciar Preparo</button>` : ''}
              ${p.status === 'preparando' ? `<button class="btn-pronto" onclick="mudarStatus(${p.id}, 'pronto')">✅ Marcar Pronto</button>` : ''}
              ${p.status === 'pronto' ? `<button class="btn-entregue" onclick="mudarStatus(${p.id}, 'entregue')">📦 Entregue/Retirado</button>` : ''}
              ${p.status === 'entregue' ? '<span style="color:#95a5a6; font-size:14px;">✅ Concluído</span>' : ''}
            </div>
          </div>
        `).join('');
    }

    async function mudarStatus(id, novoStatus) {
      if (!confirm(`Alterar status para "${novoStatus}"?`)) return;
      await fetch(`/api/pedidos/${id}/status`, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({status: novoStatus})
      });
      carregarPedidos();
    }

    carregarPedidos();
    setInterval(carregarPedidos, 30000); // Atualiza a cada 30s
  </script>
</body>
</html>
